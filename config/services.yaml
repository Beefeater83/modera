# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    passkey_rp_id: '%env(default:default_passkey_rp_id:PASSKEY_RP_ID)%'
    passkey_rp_name: '%env(default:default_passkey_rp_name:PASSKEY_RP_NAME)%'
    passkey_origins: '%env(default:default_passkey_origins:PASSKEY_ORIGINS)%'
    default_passkey_rp_id: 'localhost'
    default_passkey_rp_name: 'Security'
    default_passkey_origins: 'https://modera.diakonov-it.com.ua,http://localhost,http://localhost:8000'


services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Services\CookieService:
        arguments:
            $environment: '%kernel.environment%'

    App\ArgumentResolver\PageArgumentResolver:
        tags:
            - { name: controller.argument_value_resolver, priority: 50 }

    App\ArgumentResolver\SortArgumentResolver:
        tags:
            - { name: controller.argument_value_resolver, priority: 50 }

    App\ArgumentResolver\FilterArgumentResolver:
        tags:
            - { name: controller.argument_value_resolver, priority: 50 }

    App\EventListener\ApiExceptionListener:
        arguments:
            $debug: '%kernel.debug%'

    App\Security\OAuthAuthenticator:
        arguments:
            $logger: '@monolog.logger.security'

    App\Security\OtpAuthenticator:
        arguments:
            $logger: '@monolog.logger.security'

    App\Services\OtpService:
        arguments:
            $logger: '@monolog.logger.security'

    App\Services\PasskeyService:
        arguments:
            $rpId: '%passkey_rp_id%'
            $rpName: '%passkey_rp_name%'
            $allowedOrigins: '%passkey_origins%'
            $logger: '@monolog.logger.security'

    App\Controller\Api\PasskeyController:
        arguments:
            $logger: '@monolog.logger.security'
